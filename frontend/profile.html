<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya - Travel Lombok Airport</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }
    .bg-blobs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }
    .blob-1, .blob-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 10s infinite alternate ease-in-out;
    }
    .blob-1 { background: rgba(5, 150, 105, 0.25); top: -100px; left: -50px; }
    .blob-2 { background: rgba(2, 132, 199, 0.25); bottom: -100px; right: -50px; animation-delay: -5s; }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 30px) scale(1.05); }
    }
    .profile-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 30px 25px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.1), 0 0 0 1px rgba(255,255,255,0.6) inset;
      margin: auto;
      z-index: 1;
      position: relative;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .profile-card.expanded {
      max-width: 900px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 20px;
      transition: color 0.2s;
      position: absolute;
      top: 25px;
      left: 25px;
    }
    .back-link:hover {
      color: #0f172a;
    }
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 40px auto 20px;
    }
    .avatar-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 4px solid white;
      overflow: hidden;
    }
    .avatar-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .avatar-container i.fa-user {
      font-size: 3.5rem;
      color: #94a3b8;
    }
    #profile-avatar-display {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #profile-avatar-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 0; /* Dikendalikan oleh parent */
      display: block;
    }
    .edit-avatar-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 36px;
      height: 36px;
      background: #059669;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
    }
    .edit-avatar-btn:hover {
      background: #047857;
      transform: scale(1.1);
    }
    .user-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 5px;
    }
    .user-email {
      color: #64748b;
      font-size: 0.95rem;
      margin: 0 0 20px;
    }

    /* Notif Badge */
    .notif-section {
      margin-bottom: 20px;
    }
    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .notif-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .notif-badge {
      background: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      animation: pulse-badge 1.5s ease-in-out infinite;
    }
    @keyframes pulse-badge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    }
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 12px 14px;
      text-decoration: none;
      transition: all 0.2s;
      text-align: left;
    }
    .notif-item:hover {
      background: #ffedd5;
      transform: translateX(3px);
    }
    .notif-item.paid {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .notif-item.paid:hover { background: #dcfce7; }
    .notif-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }
    .notif-icon.pending { background: #fed7aa; color: #c2410c; }
    .notif-icon.paid { background: #bbf7d0; color: #15803d; }
    .notif-icon.expired { background: #fecaca; color: #b91c1c; }
    .notif-text {
      flex: 1;
      min-width: 0;
    }
    .notif-text strong {
      display: block;
      font-size: 0.88rem;
      color: #0f172a;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-text span {
      font-size: 0.78rem;
      color: #64748b;
    }
    .notif-arrow {
      color: #94a3b8;
      font-size: 0.8rem;
    }
    .notif-empty {
      text-align: center;
      padding: 16px;
      color: #94a3b8;
      font-size: 0.85rem;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed #e2e8f0;
    }
    .notif-loading {
      text-align: center;
      padding: 16px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .quick-btn:hover {
      background: #f0f9ff;
      border-color: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
    }
    .quick-btn i {
      font-size: 1.3rem;
    }
    .quick-btn span {
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      text-align: center;
      line-height: 1.2;
    }

    /* Modal Avatar */
    .avatar-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .avatar-modal {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .avatar-modal.show {
      transform: translateY(0);
      opacity: 1;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #0f172a;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-modal:hover { color: #ef4444; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: white;
      color: #059669;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Grid Avatar */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .avatar-option {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .avatar-option img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .avatar-option:hover {
      border-color: #0284c7;
      background: #f0f9ff;
    }
    .avatar-option p {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
    }

    /* Upload Area */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8fafc;
    }
    .upload-area:hover {
      border-color: #059669;
      background: #ecfdf5;
    }
    .upload-area i {
      font-size: 2.5rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .upload-area:hover i {
      color: #059669;
    }
    .upload-area p {
      margin: 0;
      color: #64748b;
      font-weight: 500;
    }
    .quick-btn.active {
      background: #e0f2fe;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .quick-btn.active i {
      transform: scale(1.1);
    }
    
    /* Inline View Container */
    .inline-view-container {
      display: none;
      width: 100%;
      border-top: 1px dashed #cbd5e1;
      margin-top: 20px;
      padding-top: 20px;
      animation: fadeInDown 0.4s ease forwards;
    }
    .inline-view-container.active {
      display: block;
    }
    .inline-view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .inline-view-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }
    .close-inline-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-inline-btn:hover { color: #ef4444; }
    
    #inline-frame {
      width: 100%;
      border: none;
      border-radius: 12px;
      min-height: 400px;
      background: transparent;
      transition: height 0.3s ease;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob-1"></div>
    <div class="blob-2"></div>
  </div>

  <div class="profile-card">
    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
    
    <div class="avatar-wrapper">
      <div class="avatar-container">
        <div id="profile-avatar-display"><i class="fa-solid fa-user"></i></div>
      </div>
      <div class="edit-avatar-btn" onclick="openAvatarModal()">
        <i class="fa-solid fa-camera"></i>
      </div>
    </div>
    
    <h2 class="user-name" id="profile-name">Memuat...</h2>
    <p class="user-email" id="profile-email">memuat...</p>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button onclick="loadInlineView('/riwayat.html', this, 'Riwayat Booking')" class="quick-btn">
        <i class="fa-solid fa-clock-rotate-left" style="color: #3b82f6;"></i>
        <span>Riwayat Booking</span>
      </button>
      <button onclick="loadInlineView('/wishlist.html', this, 'Wishlist Anda')" class="quick-btn">
        <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
        <span>Wishlist</span>
      </button>
      <button onclick="loadInlineView('/jadwal-sholat.html', this, 'Jadwal Sholat')" class="quick-btn">
        <i class="fa-solid fa-mosque" style="color: #059669;"></i>
        <span>Jadwal Sholat</span>
      </button>
    </div>

    <!-- Container Inline View -->
    <div class="inline-view-container" id="inline-container">
      <div class="inline-view-header">
        <span class="inline-view-title" id="inline-title">Tampilan</span>
        <button class="close-inline-btn" onclick="closeInlineView()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <iframe id="inline-frame" src="about:blank"></iframe>
    </div>

    <!-- Notifikasi Booking -->
    <div class="notif-section">
      <div class="notif-header">
        <span class="notif-title"><i class="fa-solid fa-bell" style="margin-right:5px;"></i>Notifikasi</span>
        <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
      </div>
      <div class="notif-list" id="notif-list">
        <div class="notif-loading"><i class="fa-solid fa-spinner fa-spin" style="margin-right:6px;"></i>Memuat notifikasi...</div>
      </div>
    </div>

    <button onclick="logoutUser()" class="btn" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; width: 100%; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s;">
      <i class="fa-solid fa-right-from-bracket"></i> Keluar (Logout)
    </button>
  </div>

  <!-- Modal Pilih Avatar -->
  <div class="avatar-modal-overlay" id="avatar-modal">
    <div class="avatar-modal" id="avatar-modal-content">
      <div class="modal-header">
        <h3>Ubah Foto Profil</h3>
        <button class="close-modal" onclick="closeAvatarModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('upload')">Upload Foto</button>
        <button class="tab-btn" onclick="switchTab('islami')">Kartun Islami</button>
        <button class="tab-btn" onclick="switchTab('umum')">Kartun Umum</button>
      </div>

      <!-- Tab Upload -->
      <div class="tab-content active" id="tab-upload">
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <p>Klik untuk memilih foto dari galeri</p>
        </div>
        <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" onchange="handleFileUpload(event)">
      </div>

      <!-- Tab Kartun Islami -->
      <div class="tab-content" id="tab-islami">
        <div class="avatar-grid">
          <div class="avatar-option" onclick="selectPredefinedAvatar('/avatars/islamic_male.jpg')">
            <img src="/avatars/islamic_male.jpg" alt="Pria Islami">
            <p>Pria Islami</p>
          </div>
          <div class="avatar-option" onclick="selectPredefinedAvatar('/avatars/islamic_female.jpg')">
            <img src="/avatars/islamic_female.jpg" alt="Wanita Islami">
            <p>Wanita Islami</p>
          </div>
        </div>
      </div>

      <!-- Tab Kartun Umum -->
      <div class="tab-content" id="tab-umum">
        <div class="avatar-grid">
          <div class="avatar-option" onclick="selectPredefinedAvatar('/avatars/general_male.jpg')">
            <img src="/avatars/general_male.jpg" alt="Pria Traveler">
            <p>Pria Traveler</p>
          </div>
          <div class="avatar-option" onclick="selectPredefinedAvatar('https://ui-avatars.com/api/?name=Wanita+Traveler&background=random')">
            <img src="https://ui-avatars.com/api/?name=Wanita+Traveler&background=random&color=fff&rounded=true" alt="Wanita Traveler">
            <p>Wanita Traveler</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/main.js"></script>
  <script>
    // Standalone logout - tidak bergantung window.logoutUser dari main.js
    function logoutUser() {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          title: 'Konfirmasi',
          text: 'Apakah Anda yakin ingin keluar?',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Ya, Logout',
          cancelButtonText: 'Batal',
          confirmButtonColor: '#ef4444'
        }).then(result => {
          if (result.isConfirmed) {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            window.location.href = '/';
          }
        });
      } else {
        if (confirm('Apakah Anda yakin ingin keluar?')) {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('auth_user');
          window.location.href = '/';
        }
      }
    }
    // Load User Data
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('auth_user') || 'null');
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      
      document.getElementById('profile-name').textContent = user.name || user.email.split('@')[0];
      document.getElementById('profile-email').textContent = user.email;
      
      if (user.photoUrl) {
        document.getElementById('profile-avatar-display').innerHTML = `<img src="${user.photoUrl}" alt="Avatar">`;
      }

      // Load Notifikasi Booking
      loadNotifikasi(user.email);
    });

    async function loadNotifikasi(email) {
      const notifList = document.getElementById('notif-list');
      const notifBadge = document.getElementById('notif-badge');
      const token = localStorage.getItem('auth_token');

      try {
        const res = await fetch(`${API_URL}/api/bookings/my`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('Gagal fetch');
        const data = await res.json();

        // Gabungkan bookings + orders
        const all = [...(data.bookings || []), ...(data.orders || [])];

        // Filter yang perlu notifikasi (PENDING, atau baru PAID)
        const pending = all.filter(b => b.status === 'PENDING');
        const baru = all.filter(b => b.status === 'PAID' || b.status === 'confirmed');
        const expired = all.filter(b => b.status === 'KADALUARSA');

        const totalAlert = pending.length;
        if (totalAlert > 0) {
          notifBadge.style.display = 'inline-block';
          notifBadge.textContent = totalAlert;
        }

        const items = [];

        pending.forEach(b => {
          items.push({
            type: 'pending',
            label: b.itemName,
            sub: 'Menunggu pembayaran',
            icon: 'fa-clock',
            cls: '',
            iconCls: 'pending'
          });
        });

        baru.forEach(b => {
          items.push({
            type: 'paid',
            label: b.itemName,
            sub: 'Pembayaran dikonfirmasi ✓',
            icon: 'fa-circle-check',
            cls: 'paid',
            iconCls: 'paid'
          });
        });

        expired.forEach(b => {
          items.push({
            type: 'expired',
            label: b.itemName,
            sub: 'Booking kadaluarsa',
            icon: 'fa-circle-xmark',
            cls: '',
            iconCls: 'expired'
          });
        });

        if (items.length === 0) {
          notifList.innerHTML = `<div class="notif-empty"><i class="fa-regular fa-bell-slash" style="font-size:1.5rem; display:block; margin-bottom:6px;"></i>Tidak ada notifikasi</div>`;
          return;
        }

        // Tampilkan maks 4 item terbaru
        notifList.innerHTML = items.slice(0, 4).map(item => `
          <a href="/riwayat.html" class="notif-item ${item.cls}">
            <div class="notif-icon ${item.iconCls}"><i class="fa-solid ${item.icon}"></i></div>
            <div class="notif-text">
              <strong>${item.label}</strong>
              <span>${item.sub}</span>
            </div>
            <i class="fa-solid fa-chevron-right notif-arrow"></i>
          </a>
        `).join('');

        if (items.length > 4) {
          notifList.innerHTML += `<a href="/riwayat.html" style="display:block; text-align:center; font-size:0.82rem; color:#3b82f6; font-weight:600; padding:8px; text-decoration:none;">Lihat semua (${items.length}) →</a>`;
        }

      } catch (e) {
        notifList.innerHTML = `<div class="notif-empty">Tidak dapat memuat notifikasi</div>`;
      }
    }

    // Modal Logic
    const modal = document.getElementById('avatar-modal');
    const modalContent = document.getElementById('avatar-modal-content');

    function openAvatarModal() {
      modal.style.display = 'flex';
      setTimeout(() => modalContent.classList.add('show'), 10);
    }

    function closeAvatarModal() {
      modalContent.classList.remove('show');
      setTimeout(() => modal.style.display = 'none', 300);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // Avatar Selection Logic
    async function selectPredefinedAvatar(url) {
      // Use absolute URL if it's a relative path
      const fullUrl = url.startsWith('/') ? window.location.origin + url : url;
      await updateAvatar({ imageUrl: fullUrl });
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        Swal.fire('Terlalu Besar', 'Maksimal ukuran foto adalah 5MB.', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64String = reader.result;
        await updateAvatar({ imageBase64: base64String });
      };
      reader.readAsDataURL(file);
    }

    async function updateAvatar(payload) {
      const token = localStorage.getItem('auth_token');
      if (!token) {
        Swal.fire('Error', 'Sesi Anda telah habis. Silakan login kembali.', 'error');
        return;
      }

      payload.idToken = token;

      Swal.fire({
        title: 'Menyimpan Foto...',
        text: 'Mohon tunggu sebentar',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });

      try {
        const response = await fetch(`${API_URL}/api/auth/upload-avatar`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const textResponse = await response.text();
        let data;
        try {
          data = JSON.parse(textResponse);
        } catch (e) {
          throw new Error('Server backend belum diperbarui. Silakan lakukan pull/restart pada server backend Anda.');
        }

        if (response.ok && data.success) {
          // Update local storage
          const user = JSON.parse(localStorage.getItem('auth_user'));
          user.photoUrl = data.url;
          localStorage.setItem('auth_user', JSON.stringify(user));

          // Update UI
          document.getElementById('profile-avatar-display').innerHTML = `<img src="${data.url}" alt="Avatar">`;
          
          closeAvatarModal();
          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Foto profil Anda telah diperbarui.',
            timer: 2000,
            showConfirmButton: false
          });
        } else {
          throw new Error(data.error || 'Terjadi kesalahan');
        }
      } catch (error) {
        console.error(error);
        Swal.fire('Gagal', error.message, 'error');
      }
    }

    // Inline View Logic
    function loadInlineView(url, btnElement, title) {
      // Remove active class from all buttons
      document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      btnElement.classList.add('active');

      const container = document.getElementById('inline-container');
      const frame = document.getElementById('inline-frame');
      const card = document.querySelector('.profile-card');
      const notifSection = document.querySelector('.notif-section');

      // Expand card & show container
      card.classList.add('expanded');
      container.classList.add('active');
      if(notifSection) notifSection.style.display = 'none';

      document.getElementById('inline-title').textContent = title;

      // Load URL with ?inline=1
      frame.src = url + '?inline=1';

      // Adjust height automatically when iframe loads
      frame.onload = () => {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          
          // Remove internal scrolling from the iframe body to get true scrollHeight
          doc.body.style.overflow = 'hidden';
          doc.documentElement.style.overflow = 'hidden';
          
          // Create a ResizeObserver to continuously track height changes
          const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
              const newHeight = entry.target.scrollHeight;
              frame.style.height = (newHeight + 50) + 'px'; // add buffer
            }
          });
          
          resizeObserver.observe(doc.body);
          
          // Initial height set
          const height = doc.documentElement.scrollHeight || doc.body.scrollHeight;
          frame.style.height = (height + 50) + 'px';
        } catch (e) {
          // Fallback if cross-origin or errors out
          frame.style.height = '600px';
        }
      };
    }

    function closeInlineView() {
      // Remove active class
      document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
      
      const container = document.getElementById('inline-container');
      const card = document.querySelector('.profile-card');
      const frame = document.getElementById('inline-frame');
      const notifSection = document.querySelector('.notif-section');
      
      container.classList.remove('active');
      card.classList.remove('expanded');
      frame.src = 'about:blank';
      if(notifSection) notifSection.style.display = 'block';
    }
  </script>
</body>
