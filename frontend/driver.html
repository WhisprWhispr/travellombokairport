<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Supir | Travel Lombok</title>
  <!-- Halaman internal - tidak perlu diindex oleh Google -->
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="manifest" href="/manifest-driver.json">
  <meta name="theme-color" content="#eab308">
  <style>
    body { background-color: #f8fafc; min-height: 100vh; margin: 0; display: flex; flex-direction: column; color: #334155; }
    .driver-container { max-width: 600px; margin: 0 auto; width: 100%; padding: 20px; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; }
    .login-box { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; margin: auto 0; border: 1px solid #f1f5f9; }
    .dashboard { display: none; }
    
    .trip-card { 
      background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; 
      border-left: 5px solid #3b82f6; position: relative; transition: all 0.2s ease;
    }
    .trip-card:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0,0,0,0.05); }
    .trip-card.completed { border-left-color: #10b981; opacity: 0.8; }
    
    .trip-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 15px; gap: 10px; }
    .trip-title { font-size: 1.1rem; font-weight: 700; color: #1e293b; line-height: 1.4; }
    
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-paid { background: #dcfce7; color: #166534; }
    .badge-completed { background: #f1f5f9; color: #475569; }
    
    .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.95rem; color: #475569; }
    .info-row i { color: #94a3b8; width: 20px; text-align: center; font-size: 1.1rem; }
    
    .action-buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; border-top: 1px dashed #e2e8f0; padding-top: 20px; }
    
    .wa-btn, .complete-btn { 
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 12px; text-decoration: none; 
      font-size: 0.95rem; font-weight: 600; cursor: pointer; flex: 1 1 200px;
      transition: all 0.2s ease; text-align: center; border: none;
    }
    .wa-btn { background: #128C7E; color: white; box-shadow: 0 4px 6px rgba(18,140,126,0.15); }
    .wa-btn:hover { background: #075E54; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(18,140,126,0.2); }
    
    .complete-btn { background: #3b82f6; color: white; box-shadow: 0 4px 6px rgba(59,130,246,0.15); }
    .complete-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(59,130,246,0.2); }
    
    .header-bar { 
      background: white; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; 
      border-radius: 16px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;
    }
    
    input.form-control { border-radius: 10px; padding: 12px 15px; border: 1px solid #cbd5e1; font-size: 1rem; }
    input.form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  </style>
<script src="/protect.js"></script>
</head>
<body>
  <div class="driver-container">
    
    <!-- Login Section -->
    <div id="login-section" class="login-box">
      <img src="/logo.png" alt="Logo" style="height: 60px; margin-bottom: 10px;">
      <h2 style="color: var(--primary-blue); margin-bottom: 5px;">Portal Supir</h2>
      <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 25px;">Masukkan Nomor HP dan PIN Anda</p>
      
      <form id="driver-login-form">
        <div class="form-group" style="text-align: left;">
          <label>Nomor HP</label>
          <input type="tel" id="d-phone" class="form-control" placeholder="0812..." required>
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 25px;">
          <label>PIN (6 Angka)</label>
          <input type="password" id="d-pin" class="form-control" placeholder="******" maxlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Masuk <i class="fa-solid fa-arrow-right"></i></button>
      </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="dashboard">
      <div class="header-bar">
        <div>
          <p style="margin: 0; font-size: 0.8rem; color: var(--text-gray);">Selamat Datang,</p>
          <h3 id="driver-name-display" style="margin: 0; color: var(--text-dark);">Nama Supir</h3>
        </div>
        <div>
          <button onclick="showDriverTutorial()" style="background: none; border: 1px solid #10b981; color: #10b981; font-size: 0.9rem; padding: 4px 10px; border-radius: 8px; cursor: pointer; margin-right: 10px;"><i class="fa-solid fa-circle-question"></i> Panduan</button>
          <button onclick="logoutDriver()" style="background: none; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-power-off"></i></button>
        </div>
      </div>

      <h3 style="margin-bottom: 15px; color: var(--text-dark);">Jadwal Trip Anda</h3>
      <div id="trips-container">
        <!-- Trips injected via JS -->
      </div>
    </div>
    
  </div>

  <script type="module" src="/driver.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
