<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Travel Lombok Airport</title>
  <!-- Halaman internal - tidak perlu diindex oleh Google -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .auth-logo img {
      height: 60px;
      object-fit: contain;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 5px;
    }
    .auth-subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    .form-control:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-blue), #1e40af);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .auth-footer {
      text-align: center;
      margin-top: 25px;
      color: #64748b;
      font-size: 0.95rem;
    }
    .auth-link {
      color: var(--primary-blue);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
    .forgot-link {
      display: block;
      text-align: right;
      margin-top: -10px;
      margin-bottom: 18px;
      font-size: 0.85rem;
      color: var(--primary-blue);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      color: #64748b;
      border: 1px solid #e2e8f0;
      padding: 8px 15px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    /* Modal Lupa Sandi */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 36px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.18);
      animation: slideUp 0.25s ease;
      position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .modal-close:hover { color: #0f172a; }
    .modal-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.5rem;
      color: #1d4ed8;
    }
    .modal-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .modal-desc {
      text-align: center;
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .btn-reset {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary-blue, #2563eb), #1e40af);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 6px;
    }
    .btn-reset:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .btn-reset:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .auth-separator {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .auth-separator::before, .auth-separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .auth-separator span {
      padding: 0 10px;
    }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: white;
      color: #334155;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn-google img {
      width: 24px;
      height: 24px;
    }
    .btn-google:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
<script src="/protect.js"></script>
</head>
<body>

  <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali</a>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="/logo.png" alt="Travel Lombok Airport">
    </div>
    <div class="auth-header">
      <h1 class="auth-title">Selamat Datang</h1>
      <p class="auth-subtitle">Login untuk melanjutkan pesanan Anda.</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required placeholder="email@contoh.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" required placeholder="Masukkan password Anda" style="padding-right: 40px;">
          <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;"></i>
        </div>
      </div>
      <a id="forgot-link" class="forgot-link"><i class="fa-solid fa-key" style="margin-right:4px;"></i>Lupa Sandi?</a>
      <div class="form-group" style="display: flex; justify-content: center; margin-top: 10px; margin-bottom: 20px;">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEY5_o0-MiC2wPpS" data-theme="light"></div>
      </div>
      <button type="submit" class="btn-submit" id="btn-submit"><i class="fa-regular fa-envelope" style="margin-right: 8px;"></i>Lanjutkan dengan Email</button>
      
      <div class="auth-separator">
        <span>Atau</span>
      </div>
      
      <button type="button" class="btn-google" id="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Lanjutkan dengan Google
      </button>
    </form>
    
    <div class="auth-footer">
      Belum punya akun? <a href="/register.html" class="auth-link">Daftar di sini</a>
    </div>
  </div>

  <!-- Firebase JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6iPEJgUiZpRkt6YMaIk4Z2tglVF1MiBs",
      authDomain: "travellombokairport.firebaseapp.com",
      projectId: "travellombokairport"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const btnGoogle = document.getElementById('btn-google');
    if(btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
            btnGoogle.disabled = true;
            btnGoogle.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i>Memproses...';
            
            try {
                const result = await signInWithPopup(auth, provider);
                const idToken = await result.user.getIdToken();
                
                // Send to backend
                const res = await fetch(`${API_URL}/api/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || 'Login Google gagal');
                }
                
                localStorage.setItem('auth_token', data.token);
                if (data.user) {
                    localStorage.setItem('user_info', JSON.stringify(data.user));
                }
                
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil',
                    text: 'Login berhasil!',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    const params = new URLSearchParams(window.location.search);
                    const returnUrl = params.get('return') || '/';
                    window.location.href = returnUrl;
                });
                
            } catch (error) {
                console.error("Google Login Error:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Login Gagal',
                    text: error.message || 'Terjadi kesalahan saat login dengan Google.'
                });
                btnGoogle.disabled = false;
                btnGoogle.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Lanjutkan dengan Google';
            }
        });
    }
  </script>

  <!-- Modal Lupa Sandi -->
  <div class="modal-overlay" id="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-modal-title">
    <div class="modal-box">
      <button class="modal-close" id="close-forgot-modal" aria-label="Tutup">&#x2715;</button>
      <div class="modal-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
      <h2 class="modal-title" id="forgot-modal-title">Lupa Sandi?</h2>
      <p class="modal-desc">Masukkan email yang terdaftar. Kami akan mengirimkan link untuk mereset sandi Anda.</p>
      <div class="form-group">
        <label for="reset-email">Email Terdaftar</label>
        <input type="email" id="reset-email" class="form-control" placeholder="email@contoh.com" autocomplete="email">
      </div>
      <button class="btn-reset" id="btn-reset"><i class="fa-solid fa-paper-plane" style="margin-right:6px;"></i>Kirim Link Reset</button>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('auth_token')) {
        window.location.href = '/';
    }

    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    if(togglePassword && password) {
      togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
      });
    }

    // ── Lupa Sandi Modal ──────────────────────────────────────────────
    const forgotModal  = document.getElementById('forgot-modal');
    const forgotLink   = document.getElementById('forgot-link');
    const closeBtn     = document.getElementById('close-forgot-modal');
    const btnReset     = document.getElementById('btn-reset');
    const resetEmailEl = document.getElementById('reset-email');

    function openForgotModal() {
        resetEmailEl.value = document.getElementById('email').value || '';
        forgotModal.classList.add('active');
        resetEmailEl.focus();
    }
    function closeForgotModal() {
        forgotModal.classList.remove('active');
    }

    forgotLink.addEventListener('click', openForgotModal);
    closeBtn.addEventListener('click', closeForgotModal);
    forgotModal.addEventListener('click', (e) => {
        if (e.target === forgotModal) closeForgotModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeForgotModal();
    });

    btnReset.addEventListener('click', async () => {
        const email = resetEmailEl.value.trim();
        if (!email) {
            resetEmailEl.focus();
            resetEmailEl.style.borderColor = '#ef4444';
            setTimeout(() => resetEmailEl.style.borderColor = '', 1500);
            return;
        }
        btnReset.disabled = true;
        btnReset.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:6px;"></i>Mengirim...';
        try {
            const res  = await fetch(`${API_URL}/api/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            closeForgotModal();
            if (res.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Email Terkirim!',
                    html: `<p>Link reset sandi telah dikirim ke <b>${email}</b>.</p><p style="font-size:0.88rem;color:#64748b;margin-top:8px;">Cek kotak masuk email Anda (termasuk folder Spam/Junk).</p>`,
                    confirmButtonColor: '#1d4ed8'
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Mengirim',
                    text: data.error || 'Terjadi kesalahan. Silakan coba lagi.',
                    confirmButtonColor: '#1d4ed8'
                });
            }
        } catch (err) {
            closeForgotModal();
            Swal.fire({
                icon: 'error',
                title: 'Gagal Mengirim',
                text: 'Tidak dapat terhubung ke server. Coba lagi nanti.',
                confirmButtonColor: '#1d4ed8'
            });
        } finally {
            btnReset.disabled = false;
            btnReset.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:6px;"></i>Kirim Link Reset';
        }
    });
    // ─────────────────────────────────────────────────────────────────

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btn-submit');
        
        const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]')?.value;
        if (!turnstileResponse) {
            Swal.fire({
                icon: 'warning',
                title: 'Verifikasi Keamanan',
                text: 'Harap selesaikan verifikasi centang Cloudflare terlebih dahulu.',
                confirmButtonColor: '#1d4ed8'
            });
            return;
        }
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
        
        try {
            const res = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, turnstileToken: turnstileResponse })
            });
            
            const data = await res.json();
            
            if (!res.ok) {
                if (data.unverified) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Akun Belum Diverifikasi',
                        html: '<p style="margin-bottom:10px;">Anda tidak dapat login karena email belum diverifikasi.</p><p style="font-size:0.9rem;">Silakan cek kotak masuk email Anda (termasuk folder Spam/Junk) dan klik tautan verifikasi yang telah kami kirimkan.</p>',
                        confirmButtonText: 'Tutup',
                        confirmButtonColor: '#1d4ed8'
                    });
                    if (window.turnstile) window.turnstile.reset();
                    btn.disabled = false;
                    btn.innerHTML = 'Login Sekarang';
                    return;
                }
                throw new Error(data.error || 'Terjadi kesalahan saat login.');
            }
            
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('auth_user', JSON.stringify(data.user || data.admin));
            
            Swal.fire({
                icon: 'success',
                title: 'Berhasil Login!',
                text: 'Mengarahkan ke halaman utama...',
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                // Return to previous page or home
                const prev = sessionStorage.getItem('redirect_after_auth');
                if (prev) {
                    sessionStorage.removeItem('redirect_after_auth');
                    window.location.href = prev;
                } else {
                    window.location.href = '/';
                }
            });
            
        } catch (err) {
            if (window.turnstile) window.turnstile.reset();
            
            if (err.message.includes('Terlalu banyak percobaan')) {
                localStorage.setItem('block_auth_until', Date.now() + 15 * 60 * 1000);
                checkRateLimitBlock();
            } else {
                btn.disabled = false;
                btn.innerHTML = 'Login Sekarang';
            }

            Swal.fire({
                icon: 'error',
                title: 'Login Gagal',
                text: err.message,
                confirmButtonColor: '#1d4ed8'
            });
        }
    });

    // Rate Limit Blocker Logic
    function checkRateLimitBlock() {
        const blockUntil = localStorage.getItem('block_auth_until');
        if (blockUntil) {
            const timeRemaining = parseInt(blockUntil) - Date.now();
            const btn = document.getElementById('btn-submit');
            if (timeRemaining > 0) {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
                btn.innerHTML = `Diblokir (${Math.ceil(timeRemaining / 60000)}m)`;
                setTimeout(checkRateLimitBlock, 60000);
            } else {
                localStorage.removeItem('block_auth_until');
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
                btn.innerHTML = 'Login Sekarang';
            }
        }
    }
    checkRateLimitBlock();
  </script>
</body>
</html>
