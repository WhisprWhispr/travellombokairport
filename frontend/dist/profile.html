<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya - Travel Lombok Airport</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background: #f8fafc;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: #0f172a;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Left Sidebar */
    .dashboard-sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.02);
      z-index: 10;
    }
    
    /* Main Content */
    .dashboard-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      position: relative;
      background: #f8fafc;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 30px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #0f172a; }

    /* Sidebar contents */
    .avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; }
    .avatar-container { width: 100%; height: 100%; border-radius: 50%; background: #e2e8f0; display: flex; justify-content: center; align-items: center; border: 3px solid #f1f5f9; overflow: hidden; }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-container i.fa-user { font-size: 3rem; color: #94a3b8; }
    #profile-avatar-display { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    .edit-avatar-btn { position: absolute; bottom: 0; right: 0; width: 32px; height: 32px; background: #059669; color: white; border: 2px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4); }
    .edit-avatar-btn:hover { background: #047857; transform: scale(1.1); }
    
    .user-name { font-size: 1.25rem; font-weight: 800; text-align: center; margin: 0 0 5px; }
    .user-email { color: #64748b; font-size: 0.85rem; text-align: center; margin: 0 0 30px; word-break: break-all; }

    /* Menu List */
    .menu-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: transparent; border: none; color: #475569; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: left; text-decoration: none; font-family: 'Outfit', sans-serif;}
    .menu-item:hover { background: #f1f5f9; color: #0f172a; }
    .menu-item.active { background: #e0f2fe; color: #0369a1; }
    .menu-item i { font-size: 1.1rem; width: 24px; text-align: center; }
    .logout-btn { color: #ef4444; margin-top: auto; }
    .logout-btn:hover { background: #fef2f2; color: #dc2626; }

    /* Content sections */
    .default-view { max-width: 800px; margin: 0 auto; display: block; animation: fadeIn 0.4s ease; }
    .inline-view-container { display: none; width: 100%; height: 100%; flex-direction: column; animation: fadeIn 0.4s ease; }
    .inline-view-container.active { display: flex; }
    
    .inline-view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .inline-view-title { font-size: 1.5rem; font-weight: 800; color: #0f172a; }
    .close-inline-btn { background: #f1f5f9; border: none; color: #64748b; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .close-inline-btn:hover { background: #fee2e2; color: #ef4444; }
    
    #inline-frame { width: 100%; flex: 1; border: none; border-radius: 16px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

    /* Notif */
    .notif-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .notif-title { font-size: 1.2rem; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px;}
    .notif-badge { background: #ef4444; color: white; font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; animation: pulse-badge 1.5s ease-in-out infinite; }
    @keyframes pulse-badge { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-item { display: flex; align-items: center; gap: 15px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px 20px; text-decoration: none; transition: all 0.2s; }
    .notif-item:hover { border-color: #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transform: translateY(-2px); }
    .notif-item.pending { background: #fff7ed; border-color: #fed7aa; }
    .notif-item.paid { background: #f0fdf4; border-color: #bbf7d0; }
    .notif-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.2rem; }
    .notif-icon.pending { background: #fed7aa; color: #c2410c; }
    .notif-icon.paid { background: #bbf7d0; color: #15803d; }
    .notif-icon.expired { background: #fecaca; color: #b91c1c; }
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .avatar-modal {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .avatar-modal.show {
      transform: translateY(0);
      opacity: 1;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #0f172a;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-modal:hover { color: #ef4444; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: white;
      color: #059669;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Grid Avatar */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .avatar-option {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .avatar-option img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .avatar-option:hover {
      border-color: #0284c7;
      background: #f0f9ff;
    }
    .avatar-option p {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
    }

    /* Upload Area */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8fafc;
    }
    .upload-area:hover {
      border-color: #059669;
      background: #ecfdf5;
    }
    .upload-area i {
      font-size: 2.5rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .upload-area:hover i {
      color: #059669;
    }
    .upload-area p {
      margin: 0;
      color: #64748b;
      font-weight: 500;
    }
    .quick-btn.active {
      background: #e0f2fe;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .quick-btn.active i {
      transform: scale(1.1);
    }
    
    /* Inline View Container */
    .inline-view-container {
      display: none;
      width: 100%;
      border-top: 1px dashed #cbd5e1;
      margin-top: 20px;
      padding-top: 20px;
      animation: fadeInDown 0.4s ease forwards;
    }
    .inline-view-container.active {
      display: block;
    }
    .inline-view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .inline-view-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }
    .close-inline-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-inline-btn:hover { color: #ef4444; }
    
    #inline-frame {
      width: 100%;
      border: none;
      border-radius: 12px;
      min-height: 400px;
      background: transparent;
      transition: height 0.3s ease;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script src="/config.js"></script>

  <script>
    // Standalone logout - tidak bergantung window.logoutUser dari main.js
    function logoutUser() {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          title: 'Konfirmasi',
          text: 'Apakah Anda yakin ingin keluar?',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Ya, Logout',
          cancelButtonText: 'Batal',
          confirmButtonColor: '#ef4444'
        }).then(result => {
          if (result.isConfirmed) {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            window.location.href = '/';
          }
        });
      } else {
        if (confirm('Apakah Anda yakin ingin keluar?')) {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('auth_user');
          window.location.href = '/';
        }
      }
    }
    // Load User Data
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('auth_user') || 'null');
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      
      document.getElementById('profile-name').textContent = user.name || user.email.split('@')[0];
      document.getElementById('profile-email').textContent = user.email;
      
      if (user.photoUrl) {
        document.getElementById('profile-avatar-display').innerHTML = `<img src="${user.photoUrl}" alt="Avatar">`;
      }

      // Load Notifikasi Booking
      loadNotifikasi(user.email);
    });

    async function loadNotifikasi(email) {
      const notifList = document.getElementById('notif-list');
      const notifBadge = document.getElementById('notif-badge');
      const token = localStorage.getItem('auth_token');

      try {
        const res = await fetch(`${API_URL}/api/bookings/my`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('Gagal fetch');
        const data = await res.json();

        // Gabungkan bookings + orders
        const all = [...(data.bookings || []), ...(data.orders || [])];

        // Filter yang perlu notifikasi (PENDING, atau baru PAID)
        const pending = all.filter(b => b.status === 'PENDING');
        const baru = all.filter(b => b.status === 'PAID' || b.status === 'confirmed');
        const expired = all.filter(b => b.status === 'KADALUARSA');

        const totalAlert = pending.length;
        if (totalAlert > 0) {
          notifBadge.style.display = 'inline-block';
          notifBadge.textContent = totalAlert;
        }

        const items = [];

        pending.forEach(b => {
          items.push({
            type: 'pending',
            label: b.itemName,
            sub: 'Menunggu pembayaran',
            icon: 'fa-clock',
            cls: '',
            iconCls: 'pending'
          });
        });

        baru.forEach(b => {
          items.push({
            type: 'paid',
            label: b.itemName,
            sub: 'Pembayaran dikonfirmasi ✓',
            icon: 'fa-circle-check',
            cls: 'paid',
            iconCls: 'paid'
          });
        });

        expired.forEach(b => {
          items.push({
            type: 'expired',
            label: b.itemName,
            sub: 'Booking kadaluarsa',
            icon: 'fa-circle-xmark',
            cls: '',
            iconCls: 'expired'
          });
        });

        if (items.length === 0) {
          notifList.innerHTML = `<div class="notif-empty"><i class="fa-regular fa-bell-slash" style="font-size:1.5rem; display:block; margin-bottom:6px;"></i>Tidak ada notifikasi</div>`;
          return;
        }

        // Tampilkan maks 4 item terbaru
        notifList.innerHTML = items.slice(0, 4).map(item => `
          <a href="/riwayat.html" class="notif-item ${item.cls}">
            <div class="notif-icon ${item.iconCls}"><i class="fa-solid ${item.icon}"></i></div>
            <div class="notif-text">
              <strong>${item.label}</strong>
              <span>${item.sub}</span>
            </div>
            <i class="fa-solid fa-chevron-right notif-arrow"></i>
          </a>
        `).join('');

        if (items.length > 4) {
          notifList.innerHTML += `<a href="/riwayat.html" style="display:block; text-align:center; font-size:0.82rem; color:#3b82f6; font-weight:600; padding:8px; text-decoration:none;">Lihat semua (${items.length}) →</a>`;
        }

      } catch (e) {
        notifList.innerHTML = `<div class="notif-empty">Tidak dapat memuat notifikasi</div>`;
      }
    }

    // Modal Logic
    const modal = document.getElementById('avatar-modal');
    const modalContent = document.getElementById('avatar-modal-content');

    function openAvatarModal() {
      modal.style.display = 'flex';
      setTimeout(() => modalContent.classList.add('show'), 10);
    }

    function closeAvatarModal() {
      modalContent.classList.remove('show');
      setTimeout(() => modal.style.display = 'none', 300);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // Avatar Selection Logic
    async function selectPredefinedAvatar(url) {
      // Use absolute URL if it's a relative path
      const fullUrl = url.startsWith('/') ? window.location.origin + url : url;
      await updateAvatar({ imageUrl: fullUrl });
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        Swal.fire('Terlalu Besar', 'Maksimal ukuran foto adalah 5MB.', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64String = reader.result;
        await updateAvatar({ imageBase64: base64String });
      };
      reader.readAsDataURL(file);
    }

    async function updateAvatar(payload) {
      const token = localStorage.getItem('auth_token');
      if (!token) {
        Swal.fire('Error', 'Sesi Anda telah habis. Silakan login kembali.', 'error');
        return;
      }

      payload.idToken = token;

      Swal.fire({
        title: 'Menyimpan Foto...',
        text: 'Mohon tunggu sebentar',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });

      try {
        const response = await fetch(`${API_URL}/api/auth/upload-avatar`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const textResponse = await response.text();
        let data;
        try {
          data = JSON.parse(textResponse);
        } catch (e) {
          throw new Error('Server backend belum diperbarui. Silakan lakukan pull/restart pada server backend Anda.');
        }

        if (response.ok && data.success) {
          // Update local storage
          const user = JSON.parse(localStorage.getItem('auth_user'));
          user.photoUrl = data.url;
          localStorage.setItem('auth_user', JSON.stringify(user));

          // Update UI
          document.getElementById('profile-avatar-display').innerHTML = `<img src="${data.url}" alt="Avatar">`;
          
          closeAvatarModal();
          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Foto profil Anda telah diperbarui.',
            timer: 2000,
            showConfirmButton: false
          });
        } else {
          throw new Error(data.error || 'Terjadi kesalahan');
        }
      } catch (error) {
        console.error(error);
        Swal.fire('Gagal', error.message, 'error');
      }
    }

    // Inline View Logic
    function loadInlineView(url, btnElement, title) {
      // Remove active class from all menu items
      document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      if (btnElement) btnElement.classList.add('active');

      const container = document.getElementById('inline-container');
      const defaultView = document.getElementById('default-view');
      const frame = document.getElementById('inline-frame');

      // Show container, hide default
      defaultView.style.display = 'none';
      container.classList.add('active');
      document.getElementById('inline-title').textContent = title;

      // Load URL with ?inline=1
      frame.src = url + '?inline=1';
    }

    function closeInlineView() {
      // Set active back to Dasbor
      document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById('menu-beranda').classList.add('active');
      
      const container = document.getElementById('inline-container');
      const defaultView = document.getElementById('default-view');
      const frame = document.getElementById('inline-frame');
      
      container.classList.remove('active');
      defaultView.style.display = 'block';
      frame.src = 'about:blank';
    }
  </script>
</body>
</html>
